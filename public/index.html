<div class="grp"><div class="it f"><div class="ic">👤</div><input id="bu" value="${esc((S.cloud&&S.cloud.u)||S.name||'')}" maxlength="20" placeholder="Nombre"></div><div class="it f"><div class="ic">🔒</div><input id="bp" type="text" inputmode="numeric" maxlength="8" autocomplete="off" style="-webkit-text-security:disc" placeholder="PIN (4 a 8 números)"></div></div>${BE?`<p class="sub" style="color:#ff453a;margin:6px 8px">${esc(BE)}</p>`:''}${S.cloud?`<p class="sub" style="margin:6px 8px">Último respaldo: ${ago(S.cloud.t)}</p>`:''}<button class="btn" style="margin-top:6px" onclick="bkSave()">Respaldar ahora</button><button class="btn r" style="margin-top:10px" onclick="bkLoad()">Restaurar mi respaldo</button>`;
window.bk=()=>{BE='';op(bkH())};
const bkIn=()=>{const u=$('#bu').value.trim(),p=$('#bp').value.trim();if(!u||!/^\d{4,8}$/.test(p)){BE='Escribe tu nombre y un PIN de 4 a 8 números.';$('#sh').innerHTML=bkH();return null}return{u,p}};
window.bkSave=async()=>{const c=bkIn();if(!c)return;try{const{cloud,...r}=S;await api('bk_save',{user:c.u,pin:c.p,data:JSON.stringify(r)});S.cloud={u:c.u,p:c.p,t:Date.now()};BE='';save();toast('☁️ Respaldo listo')}catch(e){BE=e.message}$('#sh').innerHTML=bkH();draw(0)};
window.bkLoad=async()=>{const c=bkIn();if(!c)return;if(!await ask('¿Restaurar respaldo?','Esto reemplaza los datos de este teléfono con tu respaldo.','Restaurar',true))return;try{const j=await api('bk_load',{user:c.u,pin:c.p}),d=JSON.parse(j.data);d.cloud={u:c.u,p:c.p,t:j.t};localStorage.setItem(K,JSON.stringify(d));location.reload()}catch(e){BE=e.message;$('#sh').innerHTML=bkH()}};
const mm=t=>+t.slice(0,2)*60+ +t.slice(3,5);
function remCheck(){if(!S.rem||!('Notification' in window)||Notification.permission!='granted')return;const n=new Date(),now=n.getHours()*60+n.getMinutes();if(!S.rn||S.rn.d!=TODAY)S.rn={d:TODAY,i:{}};todayH().forEach(h=>{if(h.s&&!isDone(h.id)&&!S.rn.i[h.id]&&now>=mm(h.s)&&now-mm(h.s)<120){S.rn.i[h.id]=1;localStorage.setItem(K,JSON.stringify(S));const o={body:h.e+' '+h.n+' — sin excusas, hazlo ahora.',icon:'/icon.svg',tag:'h'+h.id};navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification(APP,o)).catch(()=>new Notification(APP,o)):new Notification(APP,o)}})}
setInterval(remCheck,30000);
window.tRem=async()=>{if(S.rem){S.rem=false;save();return draw(0)}
if(!('Notification' in window)){await dlg('No disponible','Este navegador no permite notificaciones.','Entendido',false,false);return}
if(Notification.permission!='granted'){if(!await dlg('Activar recordatorios','Te aviso a la hora de cada hábito mientras la app esté abierta o en segundo plano. Tu teléfono te pedirá permiso.','Continuar'))return;const p=await Notification.requestPermission();if(p!='granted'){await dlg('Permiso denegado','Actívalo en los ajustes del navegador para recibir avisos.','Entendido',false,false);return}}
S.rem=true;save();toast('🔔 Recordatorios activados');draw(0)};
const CH=[
['Ducha de agua fría: los últimos 60 segundos','Camina 20 minutos sin celular','Haz 30 flexiones repartidas en el día','Levántate 20 minutos antes de lo normal','Escribe 3 cosas que has estado evitando'],
['Ducha fría completa de 2 minutos','Habla con alguien que no conoces','50 flexiones y 50 sentadillas hoy','Cero azúcar y cero redes hasta las 6 pm','Haz lo que más te cuesta antes de las 10 am'],
['Un día entero sin redes sociales','Corre o haz 40 minutos de cardio','Ducha fría de 3 minutos y 100 flexiones en el día','Pide feedback honesto a alguien y escríbelo','Escribe tu mayor miedo y da un paso hoy'],
['Despierta a las 5 am y entrena antes de las 7','Entrena dos veces hoy: mañana y noche','Haz esa llamada que llevas posponiendo','Haz 3 horas de trabajo profundo sin celular','Proponle algo a alguien que te dé miedo pedir'],
['Haz hoy lo que más has evitado esta semana','Entrena duro y estudia 2 horas antes de comer','Di en voz alta tu meta a 3 personas','Pasa un día sin quejarte ni excusarte, cuéntalo en tu diario','Pide un favor difícil o una oportunidad que mereces']];
const lvl=()=>Math.min(5,Math.floor(streak()/7)+1);
function ensureToday(){S.dcx=S.dcx||{};if(!S.dcx[TODAY]){const L=CH[lvl()-1];S.dcx[TODAY]=L[Math.floor(Date.now()/864e5)%L.length];localStorage.setItem(K,JSON.stringify(S))}}
function extras(d){const k=fmt(d),o=[],c=(S.dcx||{})[k],m=(S.cm||{})[k];if(c)o.push({id:'c',e:'🔥',t:c,sub:'Reto fuera de tu zona de confort · adáptalo a tu condición física'});if(m)o.push({id:'m',e:'🧱',t:m.t,sub:'Lo que evitaste ayer. Va primero.'});return o}
const exCard=()=>{const E=extras(new Date()),x=(S.xd||{})[TODAY]||[];return `<h3>Exigencias de hoy</h3><div class="grp">${E.map(e=>`<div class="it" onclick="tgx('${e.id}')"><div class="ic">${e.e}</div><div style="flex:1;min-width:0"><div>${esc(e.t)}</div><div class="sub" style="font-size:13px">${e.sub}</div></div><div class="ck ${x.includes(e.id)?'on':''}">✓</div></div>`).join('')}</div>`};
window.tgx=id=>{const a=(S.xd=S.xd||{})[TODAY]=S.xd[TODAY]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();chk();rsyncD();navigator.vibrate&&navigator.vibrate(12);draw(0);if(i<0&&pct(new Date())==100)boom()};
const cierreCard=()=>{const c=(S.cd||{})[TODAY];return `<h3>Cierre del día</h3><div class="grp"><div class="it" onclick="cierre()"><div class="ic">${c?(c.ok?'✅':'🧱'):'🌙'}</div><div style="flex:1;min-width:0"><div>${c?(c.ok?'Día cerrado: diste todo':'Evitaste: '+esc(c.av)):'¿Diste todo hoy?'}</div><div class="sub" style="font-size:13px">${c?'Toca para volver a cerrar':'Sé honesto. Solo se cierra si vas en 80% o más.'}</div></div><span class="sub">›</span></div></div>`};
window.cierre=()=>{if(pct(new Date())>=80){S.cd=S.cd||{};S.cd[TODAY]={ok:true};save();toast('💪 Día cerrado. Eso es disciplina.');boom();draw(0)}else op(avH())};
const avH=()=>`<div class="gr"></div><div class="row between" style="margin-bottom:8px"><button class="x" style="color:var(--m)" onclick="cl()">Cancelar</button><b>Cierre honesto</b><button class="x" style="font-weight:600" onclick="avSave()">Guardar</button></div><p class="sub" style="margin:0 4px 10px">Tu día va en ${pct(new Date())}%. ¿Qué evitaste hoy? Mañana lo haces primero.</p><div class="grp"><div class="it f"><div class="ic">🧱</div><input id="av" maxlength="80" placeholder="Lo que evité…"></div></div>`;
window.avSave=()=>{const t=$('#av').value.trim();if(!t){$('#av').focus();return}const n=new Date(),tm=fmt(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));S.cd=S.cd||{};S.cd[TODAY]={ok:false,av:t};S.cm=S.cm||{};S.cm[tm]={t:'Hazlo primero: '+t};save();cl();toast('Mañana va primero: '+t);draw(0)};
function verdict(av,ds){const sh=ds.filter(d=>(S.cd||{})[fmt(d)]&&!S.cd[fmt(d)].ok).map(d=>S.cd[fmt(d)].av),v=av>=90?'Nivel alto. Ahora sube la vara: agrega un hábito más difícil.':av>=75?'Vas bien, pero tu mejor versión está arriba de 90%. Aprieta.':av>=50?'Mediocre. Sabes que puedes más. Misma meta, cero excusas.':'Esta semana te ganó la comodidad. Empieza hoy, no el lunes.';return v+(sh.length?' Evitaste: '+sh.join('; ')+'.':'')}
document.title=APP;chk(true);if(!S.seen)welcome();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
theme();nav();draw(1);rsync();
</script></body></html>
