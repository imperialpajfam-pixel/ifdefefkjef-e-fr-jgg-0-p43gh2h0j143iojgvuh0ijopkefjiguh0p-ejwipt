<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09"><link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OIGUY">
<link rel="apple-touch-icon" href="/icon.png"><link rel="icon" href="/icon.svg"><title>OIGUY</title>
<style>
:root{--a:#5fae7a;--bg:#070b09;--card:#121a15;--card2:#1c2820;--t:#f2f6f3;--m:#8a9a90;--line:#ffffff14}
[data-m=black]{--bg:#000;--card:#111;--card2:#1c1c1e}
[data-m=light]{--bg:#f2f2f7;--card:#fff;--card2:#ececf1;--t:#000;--m:#6e6e73;--line:#00000014}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--t);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;transition:background .4s,color .4s;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 110px}
.in{animation:in .45s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
h3{font-size:13px;color:var(--m);font-weight:500;margin:20px 0 7px 14px}
.sub{color:var(--m);font-size:15px}.row{display:flex;align-items:center}.between{justify-content:space-between}
.grp{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:8px;transition:background .4s}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;transition:transform .18s,background .2s}
.it+.it::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.it:active{transform:scale(.97);background:var(--card2)}
.it input{flex:1;background:none;border:0;color:var(--t);font-size:17px;outline:0;min-width:0;padding:0;font-family:inherit}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--a) 20%,transparent);flex:none}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--m);display:grid;place-items:center;flex:none;transition:.3s cubic-bezier(.3,1.6,.5,1);color:transparent;font-size:15px;font-weight:700}
.ck.on{background:var(--a);border-color:var(--a);color:#fff;animation:pop .4s}
@keyframes pop{50%{transform:scale(1.4)}}
.seg{display:flex;background:var(--card);border-radius:11px;padding:2px}
.seg a{flex:1;text-align:center;padding:7px 4px;font-size:14px;border-radius:9px;transition:.25s;color:var(--m)}
.seg a.on{background:var(--card2);color:var(--t);font-weight:600;box-shadow:0 1px 5px #0004}
.btn{width:100%;background:var(--a);color:#fff;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:600;transition:.15s;font-family:inherit}
.btn:active{transform:scale(.96);filter:brightness(.9)}.btn.r{background:#ff453a22;color:#ff453a}
.x{background:none;border:0;color:var(--a);font-size:17px;padding:4px;font-family:inherit}
.rw{position:relative;flex:none}.rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.22)}
.pr{transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.3,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center}.stat div{font-size:22px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--m)}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--a);border-radius:3px;animation:grow .9s cubic-bezier(.3,1,.3,1)}@keyframes grow{from{width:0}}
.wk{display:flex;gap:6px;margin-top:7px}.wk span{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--card2);color:var(--m);transition:.25s}.wk span.on{background:var(--a);color:#fff}.wk span.off{opacity:.3}
.ch{display:flex;align-items:flex-end;gap:6px;padding:14px 0 4px}.ch.s{gap:2px}
.ch div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.ch i{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:var(--a);transform-origin:bottom;animation:gh .9s cubic-bezier(.3,1,.3,1)}@keyframes gh{from{transform:scaleY(0)}}
.ch small,.ch em{font-style:normal;font-size:11px;color:var(--m);height:14px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;padding:12px}.cal i{font-style:normal;color:var(--m);font-size:12px}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:15px;transition:.25s}.cal .td{font-weight:700;color:var(--a)}.cal .sl{outline:2px solid var(--a);outline-offset:1px}
.nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav div{display:flex;max-width:480px;margin:auto}.nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:10.5px;color:var(--m)}
.nav a b{display:block;font-size:23px;filter:grayscale(1);opacity:.55;transition:.3s}.nav a.on{color:var(--a)}.nav a.on b{filter:none;opacity:1;animation:pop .4s}
#ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}#ov.o{opacity:1;pointer-events:auto}
#sh{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow:auto}
#ov.o #sh{transform:none}.gr{width:38px;height:5px;border-radius:3px;background:var(--m);opacity:.4;margin:0 auto 14px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.eg span{font-size:24px;text-align:center;padding:6px 0;border-radius:11px;transition:.25s cubic-bezier(.3,1.6,.5,1)}.eg .on{background:color-mix(in srgb,var(--a) 30%,transparent);transform:scale(1.2)}
.dc{display:flex;gap:6px}.dc span{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--card);color:var(--m);transition:.25s}.dc .on{background:var(--a);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:0 4px 4px}.sw span,.sw label{width:40px;height:40px;border-radius:50%;transition:.3s cubic-bezier(.3,1.6,.5,1);display:grid;place-items:center;position:relative;overflow:hidden}.sw .on{outline:3px solid var(--t);outline-offset:3px;transform:scale(1.1)}
.sw label{background:var(--card2)}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
input[type=range]{width:100%;accent-color:var(--a);margin-top:10px}
.cf{position:fixed;font-size:24px;pointer-events:none;z-index:50;animation:cf 1.2s cubic-bezier(.2,.8,.4,1) forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div class="nav"><div id="nav"></div></div>
<div id="ov" onclick="if(event.target===this)cl()"><div id="sh"></div></div>
<script>
const K='oiguy-v1',$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=fmt(new Date()),DN=['L','M','M','J','V','S','D'],ALL=[0,1,2,3,4,5,6];
const ACC={Esmeralda:'#5fae7a',Dorado:'#d4af6a',Azul:'#0a84ff',Rosa:'#ff375f',Morado:'#bf5af2',Naranja:'#ff9f0a',Turquesa:'#40c8e0',Rojo:'#ff453a'};
const EM='💪🥊🧗📚💻💧🥗😴🧘🏃🎯🔥💰✍️🧠☀️🏋️🚴🍎🎧📵🧊🛠️⭐🌙🦾🧱🥋🏆📈🍳🚿📝'.match(/\p{Extended_Pictographic}\uFE0F?(\u200D\p{Extended_Pictographic}\uFE0F?)*/gu);
const MODS={train:['💪','Entrenamiento','Rutina, series y pesos'],box:['🥊','Boxeo y MMA','Rounds, sparring, técnica'],climb:['🧗','Escalada','Rutas, hangboard, proyectos'],code:['💻','Programación','Cursos y proyectos'],work:['💼','Trabajo','Tareas y pendientes'],fin:['💰','Finanzas','Concepto'],diary:['📓','Diario','¿Qué aprendiste hoy?']};
const DEF=[['💪','Entrenamiento','06:00'],['🥊','Boxeo / MMA','19:00'],['📚','Leer 20 min','21:00'],['💻','Estudiar / Programación','15:00'],['💧','Agua 2.5 L',''],['🥗','Comer limpio',''],['😴','Dormir temprano','22:30']];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{habits:DEF.map((h,i)=>({id:i+1,e:h[0],n:h[1],s:h[2]})),done:{},goals:[{id:1,e:'🏋️',n:'Llegar a 65 kg',p:78},{id:2,e:'🧠',n:'Roadmap de programación',p:40},{id:3,e:'💰',n:'Ahorrar 50,000 MXN',p:34}],mods:{}};
S.theme=S.theme||{acc:ACC.Esmeralda,mode:'dark'};
S.habits.forEach(h=>{h.e=h.e||'✨';h.days=h.days||ALL});S.goals.forEach((g,i)=>{g.e=g.e||'🎯';g.id=g.id||Date.now()+i});
const save=()=>localStorage.setItem(K,JSON.stringify(S));
function theme(){const r=document.documentElement;r.style.setProperty('--a',S.theme.acc);r.dataset.m=S.theme.mode;$('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim()}
const isDone=(id,d=TODAY)=>(S.done[d]||[]).includes(id),cnt=d=>(S.done[d]||[]).length;
const sched=(h,d)=>h.days.includes((d.getDay()+6)%7);
const todayH=()=>S.habits.filter(h=>sched(h,new Date()));
function hs(h){let n=0,d=new Date();for(let i=0;i<400;i++){if(sched(h,d)){if(isDone(h.id,fmt(d)))n++;else if(i>0)break}d.setDate(d.getDate()-1)}return n}
function streak(){let n=0,d=new Date();if(!cnt(fmt(d)))d.setDate(d.getDate()-1);while(cnt(fmt(d))){n++;d.setDate(d.getDate()-1)}return n}
const PV={};
const ring=(id,p,l,sz=104,w=10)=>{const r=(sz-w)/2,c=+(2*Math.PI*r).toFixed(1),o=PV[id]??c,t=+(c*(1-p/100)).toFixed(1);PV[id]=t;const m=sz/2;
return `<div class="rw" style="width:${sz}px;height:${sz}px;--s:${sz}px"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${w}"/><circle class="pr" data-t="${t}" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--a)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><b>${l}</b></div>`};
const seg=(a,cur,fn)=>`<div class="seg">${a.map(([k,l])=>`<a class="${cur==k?'on':''}" onclick="${fn}('${k}')">${l}</a>`).join('')}</div>`;
const hrow=(h,d=TODAY)=>`<div class="it" onclick="eh(${h.id})"><div class="ic">${h.e}</div><div style="flex:1;min-width:0"><div>${esc(h.n)}</div><div class="sub" style="font-size:13px">${hs(h)?'🔥 '+hs(h)+(hs(h)==1?' día':' días'):'Empieza hoy'}${h.s?' · '+h.s:''}</div></div><div class="ck ${isDone(h.id,d)?'on':''}" onclick="tg(${h.id},'${d}',event)">✓</div></div>`;
window.tg=(id,d,ev)=>{ev&&ev.stopPropagation();if(d>TODAY)return;const a=S.done[d]=S.done[d]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();navigator.vibrate&&navigator.vibrate(12);draw(0);
 if(i<0&&d==TODAY&&todayH().every(h=>isDone(h.id)))boom()};
function boom(){const E=['🎉','✨','🔥','💪','⭐','🏆'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%6];s.style.cssText=`left:50%;top:45%;--x:${(Math.random()-.5)*380}px;--y:${-120-Math.random()*300}px;--r:${(Math.random()-.5)*720}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
let tab='home',mod=null,ht='h',gtab='a',cm=new Date(),sel=TODAY;
const pct=d=>{const L=S.habits.filter(h=>sched(h,d));return L.length?Math.round(L.filter(h=>isDone(h.id,fmt(d))).length/L.length*100):0};
const chart=(v,l)=>`<div class="ch ${v.length>7?'s':''}">${v.map((p,i)=>`<div>${v.length>7?'':`<small>${p}</small>`}<i style="height:${Math.max(Math.round(p*.8),3)}px;${p?'':'opacity:.25'}"></i><em>${l[i]}</em></div>`).join('')}</div>`;
const wk7=()=>{const t=new Date(),dt=k=>new Date(t.getFullYear(),t.getMonth(),t.getDate()-k),a=[6,5,4,3,2,1,0].map(k=>pct(dt(k))),pr=[13,12,11,10,9,8,7].map(k=>pct(dt(k))),s=x=>Math.round(x.reduce((p,c)=>p+c,0)/7);return{v:a,l:[6,5,4,3,2,1,0].map(k=>DN[(dt(k).getDay()+6)%7]),av:s(a),dl:s(a)-s(pr)}};
function home(){const L=todayH(),c=L.filter(h=>isDone(h.id)).length,p=L.length?c/L.length*100:0;
const msg=p==100?'Día completo. Así se construye. 🔥':c?'Vas bien, sigue.':'Empieza con lo más fácil.';
const reg=(S.mods.train||[]).length+(S.mods.box||[]).length,w=wk7();
return `<p class="sub">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</p><h1>Hola, Olek 👋</h1><p class="sub" style="margin:2px 0 16px">${msg}</p>
<div class="grp"><div class="it" style="padding:18px;gap:20px;pointer-events:none">${ring('home',p,Math.round(p)+'%')}<div><div style="font-size:22px;font-weight:600">${c} de ${L.length}</div><div class="sub">hábitos de hoy</div></div></div></div>
<div class="stats"><div class="stat"><div>🔥</div><b>${streak()}</b><span>Racha</span></div><div class="stat"><div>📅</div><b>${Object.values(S.done).filter(a=>a.length).length}</b><span>Días activos</span></div><div class="stat"><div>🥊</div><b>${reg}</b><span>Entrenos</span></div></div>
<h3>Últimos 7 días</h3><div class="grp"><div class="it" style="display:block;pointer-events:none"><div class="row between"><span class="sub">Promedio ${w.av}%</span><b style="font-size:14px;color:${w.dl>=0?'var(--a)':'#ff453a'}">${w.dl>=0?'▲':'▼'} ${Math.abs(w.dl)}% vs. los 7 días previos</b></div>${chart(w.v,w.l)}</div></div>
<h3>Hoy</h3><div class="grp">${L.map(h=>hrow(h)).join('')||'<div class="it sub">Hoy no tienes hábitos programados.</div>'}</div>`}
window.sht=t=>{ht=t;draw(0)};
let wo=0,mo=0;
window.nv=n=>{if(ht=='w')wo=Math.min(0,wo+n);else mo=Math.min(0,mo+n);draw(0)};
const hd=(lab,can)=>`<div class="row between" style="padding:0 4px 10px"><button class="x" onclick="nv(-1)">‹</button><b>${lab}</b><button class="x" style="${can?'':'opacity:.25;pointer-events:none'}" onclick="nv(1)">›</button></div>`;
const cc=(v,l,av)=>`<div class="grp"><div class="it" style="display:block;pointer-events:none"><div class="row between"><span class="sub">Cumplimiento promedio</span><b>${av}%</b></div>${chart(v,l)}</div></div>`;
function habits(){let b;
if(ht=='h')b=`<div class="grp">${todayH().map(h=>hrow(h)).join('')||'<div class="it sub">Nada programado hoy.</div>'}</div>`;
else if(ht=='w'){const t=new Date(),m0=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(t.getDay()+6)%7+wo*7),ds=ALL.map(i=>new Date(m0.getFullYear(),m0.getMonth(),m0.getDate()+i)),past=ds.filter(d=>fmt(d)<=TODAY),v=ds.map(d=>fmt(d)>TODAY?0:pct(d)),av=Math.round(v.reduce((a,c)=>a+c,0)/(past.length||1));
const lab=wo==0?'Esta semana':wo==-1?'Semana pasada':'Semana del '+ds[0].toLocaleDateString('es-MX',{day:'numeric',month:'short'});
b=hd(lab,wo<0)+cc(v,DN,av)+`<div class="grp">${S.habits.map(h=>`<div class="it" onclick="eh(${h.id})"><div class="ic">${h.e}</div><div style="flex:1;min-width:0"><div style="font-size:15px">${esc(h.n)}</div><div class="wk">${ds.map((d,i)=>{const k=fmt(d);return `<span class="${isDone(h.id,k)?'on':''} ${sched(h,d)?'':'off'}" onclick="tg(${h.id},'${k}',event)">${DN[i]}</span>`}).join('')}</div></div></div>`).join('')}</div>`}
else{const t=new Date(),bs=new Date(t.getFullYear(),t.getMonth()+mo,1),y=bs.getFullYear(),m=bs.getMonth(),dim=new Date(y,m+1,0).getDate(),last=mo==0?t.getDate():dim,v=[],l=[];
for(let i=1;i<=dim;i++){v.push(i<=last?pct(new Date(y,m,i)):0);l.push(i==1||i%5==0?i:'')}
const av=Math.round(v.slice(0,last).reduce((a,c)=>a+c,0)/last);
b=hd(`<span style="text-transform:capitalize">${bs.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</span>`,mo<0)+cc(v,l,av)+`<div class="grp">${S.habits.map(h=>{let tt=0,c=0;for(let i=1;i<=last;i++){const d=new Date(y,m,i);if(sched(h,d)){tt++;isDone(h.id,fmt(d))&&c++}}const p=tt?Math.round(c/tt*100):0;
return `<div class="it" onclick="eh(${h.id})"><div class="ic">${h.e}</div><div style="flex:1"><div class="row between"><span style="font-size:15px">${esc(h.n)}</span><span class="sub">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div></div>`}).join('')}</div>`}
return `<h1>Hábitos</h1><p class="sub" style="margin-bottom:14px">Pequeñas acciones, grandes resultados.</p>${seg([['h','Hoy'],['w','Semana'],['m','Mes']],ht,'sht')}<div style="height:14px"></div>${b}<button class="btn" style="margin-top:10px" onclick="eh(0)">＋ Nuevo hábito</button>`}
window.mv=n=>{cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);draw(0)};window.sd=k=>{sel=k;draw(0)};
function calendar(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),tot=S.habits.length||1;
let c=DN.map(x=>`<i>${x}</i>`).join('')+'<em></em>'.repeat(f);
for(let d=1;d<=dim;d++){const k=fmt(new Date(y,m,d)),p=Math.min(1,cnt(k)/tot);c+=`<span class="${k==TODAY?'td':''} ${k==sel?'sl':''}" style="background:color-mix(in srgb,var(--a) ${Math.round(p*70)}%,transparent)" onclick="sd('${k}')">${d}</span>`}
const sdt=new Date(sel+'T12:00:00'),L=S.habits.filter(h=>sched(h,sdt));
return `<h1>Calendario</h1><div class="grp" style="margin-top:14px"><div class="row between" style="padding:14px 16px 0"><button class="x" onclick="mv(-1)">‹</button><b style="text-transform:capitalize">${cm.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</b><button class="x" onclick="mv(1)">›</button></div><div class="cal">${c}</div></div>
<h3 style="text-transform:capitalize">${sdt.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="grp">${L.map(h=>hrow(h,sel)).join('')||'<div class="it sub">Sin hábitos programados.</div>'}</div>`}
window.sg=t=>{gtab=t;draw(0)};
const goals=()=>{const a=gtab=='a',L=S.goals.filter(g=>(g.p>=100)!=a);
return `<h1>Metas</h1><div style="height:14px"></div>${seg([['a','Activas'],['c','Completadas']],gtab,'sg')}<div style="height:14px"></div>${L.map(g=>`<div class="grp" onclick="eg(${g.id})"><div class="it" style="gap:14px">${ring('g'+g.id,g.p,g.p+'%',66,7)}<div style="flex:1"><div>${g.e} ${esc(g.n)}</div><div class="sub" style="font-size:13px">Toca para ajustar</div></div></div></div>`).join('')||'<p class="sub" style="margin-bottom:12px">Nada por aquí todavía.</p>'}<button class="btn" onclick="eg(0)">＋ Nueva meta</button>`};
const more=()=>`<h1>Más</h1><p class="sub" style="margin-bottom:14px">Todo tu Winter Arc en un lugar.</p>
<div class="grp"><div class="it" onclick="th()"><div class="ic">🎨</div><div style="flex:1">Personalizar</div><span class="sub">›</span></div></div>
<h3>Módulos</h3><div class="grp">${Object.entries(MODS).map(([k,v])=>`<div class="it" onclick="om('${k}')"><div class="ic">${v[0]}</div><div style="flex:1">${v[1]}</div><span class="sub">${(S.mods[k]||[]).length} ›</span></div>`).join('')}</div>`;
window.addE=()=>{const t=$('#et').value.trim();if(!t)return;const e={id:Date.now(),t,d:TODAY,ok:false};if(mod=='fin')e.a=parseFloat($('#ea').value)||0;(S.mods[mod]=S.mods[mod]||[]).unshift(e);save();draw(0)};
window.tE=id=>{const e=S.mods[mod].find(x=>x.id==id);e.ok=!e.ok;save();draw(0)};
window.dE=(id,ev)=>{ev.stopPropagation();S.mods[mod]=S.mods[mod].filter(x=>x.id!=id);save();draw(0)};
function modv(){const [em,n,ph]=MODS[mod],L=S.mods[mod]||[],f=mod=='fin',dy=mod=='diary',tot=f?L.reduce((s,e)=>s+e.a,0):0;
return `<button class="x" onclick="om(null)" style="padding-left:0">‹ Más</button><h1>${em} ${n}</h1>${f?`<div class="grp" style="margin-top:12px"><div class="it" style="display:block"><span class="sub">Balance</span><div style="font-size:32px;font-weight:700">$${tot.toLocaleString('es-MX')} <span class="sub">MXN</span></div></div></div>`:''}
<div class="grp" style="margin:14px 0 10px"><div class="it"><input id="et" placeholder="${ph}"></div>${f?'<div class="it"><input id="ea" type="number" inputmode="decimal" placeholder="Monto (negativo = gasto)"></div>':''}</div><button class="btn" onclick="addE()">Guardar</button>
<h3>Registros</h3><div class="grp">${L.length?L.map(e=>`<div class="it" style="pointer-events:auto">${f||dy?'':`<div class="ck ${e.ok?'on':''}" onclick="tE(${e.id})">✓</div>`}<div style="flex:1;min-width:0;${e.ok?'opacity:.5;text-decoration:line-through':''}">${esc(e.t)}<div class="sub" style="font-size:13px">${e.d}</div></div>${f?`<b style="color:${e.a<0?'#ff453a':'var(--a)'}">${e.a<0?'-':'+'}$${Math.abs(e.a)}</b>`:''}<button class="x" style="color:var(--m)" onclick="dE(${e.id},event)">✕</button></div>`).join(''):'<div class="it sub">Aún no hay registros.</div>'}</div>`}
let ed=null;
const op=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('o')};
window.cl=()=>$('#ov').classList.remove('o');
window.eh=id=>{const h=S.habits.find(x=>x.id==id);ed=h?{k:'h',...h,days:[...h.days]}:{k:'h',id:0,e:'✨',n:'',s:'',days:[...ALL]};op(shH())};
window.eg=id=>{const g=S.goals.find(x=>x.id==id);ed=g?{k:'g',...g}:{k:'g',id:0,e:'🎯',n:'',p:0};op(shH())};
function sy(){const n=$('#fn'),s=$('#fs'),p=$('#fp');if(n)ed.n=n.value;if(s)ed.s=s.value;if(p)ed.p=+p.value}
window.pe=e=>{sy();ed.e=e;$('#sh').innerHTML=shH()};
window.dy=i=>{sy();const a=ed.days,j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);$('#sh').innerHTML=shH()};
function shH(){const h=ed.k=='h';
return `<div class="gr"></div><div class="row between" style="margin-bottom:14px"><button class="x" style="color:var(--m)" onclick="cl()">Cancelar</button><b>${ed.id?'Editar':'Nuevo'} ${h?'hábito':'meta'}</b><button class="x" style="font-weight:600" onclick="sv()">Guardar</button></div>
<div class="grp"><div class="it"><div class="ic" style="font-size:26px">${ed.e}</div><input id="fn" placeholder="Nombre" value="${esc(ed.n)}"></div>${h?`<div class="it"><span>Hora</span><input id="fs" type="time" value="${ed.s}" style="text-align:right"></div>`:`<div class="it" style="display:block"><div class="row between"><span>Progreso</span><b id="pv">${ed.p}%</b></div><input id="fp" type="range" min="0" max="100" value="${ed.p}" oninput="$('#pv').textContent=this.value+'%'"></div>`}</div>
${h?`<h3>Días</h3><div class="dc">${DN.map((d,i)=>`<span class="${ed.days.includes(i)?'on':''}" onclick="dy(${i})">${d}</span>`).join('')}</div>`:''}
<h3>Emoji</h3><div class="eg">${EM.map(e=>`<span class="${e==ed.e?'on':''}" onclick="pe('${e}')">${e}</span>`).join('')}</div>
${ed.id?'<button class="btn r" style="margin-top:20px" onclick="rm()">Eliminar</button>':''}`}
window.sv=()=>{sy();if(!ed.n.trim())return;const o={...ed};delete o.k;
if(ed.k=='h'){if(!o.days.length)o.days=[...ALL];ed.id?S.habits[S.habits.findIndex(x=>x.id==ed.id)]=o:S.habits.push({...o,id:Date.now()})}
else ed.id?S.goals[S.goals.findIndex(x=>x.id==ed.id)]=o:S.goals.push({...o,id:Date.now()});
save();cl();draw(0)};
window.rm=()=>{if(!confirm('¿Eliminar?'))return;const l=ed.k=='h'?'habits':'goals';S[l]=S[l].filter(x=>x.id!=ed.id);save();cl();draw(0)};
const thH=()=>`<div class="gr"></div><div class="row between" style="margin-bottom:8px"><b style="font-size:22px">Personalizar</b><button class="x" style="font-weight:600" onclick="cl()">Listo</button></div>
<h3>Color</h3><div class="sw">${Object.entries(ACC).map(([n,c])=>`<span class="${S.theme.acc==c?'on':''}" style="background:${c}" onclick="sa('${c}')"></span>`).join('')}<label>🎨<input type="color" value="${S.theme.acc}" oninput="S.theme.acc=this.value;save();theme()"></label></div>
<h3>Apariencia</h3>${seg([['dark','Oscuro'],['black','Negro'],['light','Claro']],S.theme.mode,'sm')}<div style="height:10px"></div>`;
window.th=()=>{ed=null;op(thH())};
window.sa=c=>{S.theme.acc=c;save();theme();$('#sh').innerHTML=thH();draw(0)};
window.sm=m=>{S.theme.mode=m;save();theme();$('#sh').innerHTML=thH()};
const NAV=[['home','🏠','Inicio'],['habits','✅','Hábitos'],['cal','📅','Calendario'],['goals','🎯','Metas'],['more','✨','Más']];
const nav=()=>$('#nav').innerHTML=NAV.map(n=>`<a class="${tab==n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</a>`).join('');
window.go=t=>{tab=t;mod=null;scrollTo(0,0);navigator.vibrate&&navigator.vibrate(8);nav();draw(1)};
window.om=k=>{mod=k;scrollTo(0,0);draw(1)};
function draw(a){const v={home,habits,cal:calendar,goals,more},el=$('#app');el.innerHTML=(tab=='more'&&mod)?modv():v[tab]();
if(a){el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
setTimeout(()=>$$('.pr').forEach(e=>e.style.strokeDashoffset=e.dataset.t),40)}
theme();nav();draw(1);
</script></body></html>
